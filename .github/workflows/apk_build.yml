name: APK Build
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: android-actions/setup-android@v3
      - name: Bagimliliklar
        run: npm install --legacy-peer-deps
      - name: Android platformu ekle
        run: npx cap add android 2>/dev/null || echo "ok"
      - name: Logodan ikon uret
        run: |
          npx @capacitor/assets generate \
            --iconBackgroundColor '#090c18' \
            --splashBackgroundColor '#090c18' \
            --android
        continue-on-error: true
      - name: Web dosyalarini kopyala
        run: npx cap copy android
      - name: Lisanslar
        run: yes | sdkmanager --licenses 2>/dev/null || true
      - name: APK derle
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        env: { JAVA_TOOL_OPTIONS: '-Xmx2g' }
      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: TicaretImparatorlugu-v10.54
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
