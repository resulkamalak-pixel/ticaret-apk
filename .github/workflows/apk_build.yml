name: APK Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: android-actions/setup-android@v3

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Add Android
        run: |
          npx cap add android 2>/dev/null || echo "exists"
          npx cap sync android

      - name: Fix capacitor.settings.gradle
        run: |
          CAP="android/capacitor.settings.gradle"
          if [ ! -f "$CAP" ]; then
            echo "// DO NOT EDIT - Generated" > "$CAP"
            echo "include ':capacitor-android'" >> "$CAP"
            echo "project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')" >> "$CAP"
            echo "[FIX] capacitor.settings.gradle olusturuldu"
          else
            echo "[OK] mevcut"
          fi

      - name: Setup icons
        run: |
          sudo apt-get install -y imagemagick 2>/dev/null || true
          ICON="public/logo.jpg"
          if [ -f "$ICON" ] && command -v convert &>/dev/null; then
            for s in 48 72 96 144 192; do
              case $s in 48) d=mdpi ;; 72) d=hdpi ;; 96) d=xhdpi ;; 144) d=xxhdpi ;; 192) d=xxxhdpi ;; esac
              mkdir -p android/app/src/main/res/mipmap-${d}
              convert "$ICON" -resize ${s}x${s} -background "#020008" -gravity center -extent ${s}x${s} android/app/src/main/res/mipmap-${d}/ic_launcher.png 2>/dev/null || true
              cp android/app/src/main/res/mipmap-${d}/ic_launcher.png android/app/src/main/res/mipmap-${d}/ic_launcher_round.png 2>/dev/null || true
            done
          fi

      - name: Network security config
        run: |
          mkdir -p android/app/src/main/res/xml
          echo "" | base64 -d > android/app/src/main/res/xml/network_security_config.xml
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ] && ! grep -q networkSecurityConfig "$MANIFEST"; then
            sed -i 's|<application|<application android:networkSecurityConfig="@xml/network_security_config"|' "$MANIFEST"
          fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          JAVA_TOOL_OPTIONS: "-Xmx2g"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TicaretImparatorlugu-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Summary
        run: echo "APK hazir - Artifacts bolumunden indir" >> $GITHUB_STEP_SUMMARY
