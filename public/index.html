<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ticaret İmparatorluğu</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020008}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#0a0820 0%,#020008 70%);z-index:9999;transition:opacity 0.8s ease}
#splash.gone{opacity:0;pointer-events:none}
.logo-wrap{position:relative;margin-bottom:24px}
.logo-glow{position:absolute;inset:-24px;border-radius:50%;background:radial-gradient(circle,rgba(245,208,32,.25) 0%,transparent 70%);animation:gp 2.5s ease-in-out infinite alternate}
@keyframes gp{from{transform:scale(1)}to{transform:scale(1.15)}}
.logo-img{width:140px;height:140px;border-radius:18px;object-fit:cover;border:2.5px solid rgba(245,208,32,.5);box-shadow:0 0 40px rgba(245,208,32,.3);animation:lf 4s ease-in-out infinite}
@keyframes lf{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.eco{display:block;font-family:Georgia,serif;font-size:2.8rem;font-weight:bold;letter-spacing:.4em;background:linear-gradient(135deg,#f5d020,#f5a623);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:up .7s cubic-bezier(.34,1.56,.64,1) .6s both}
.city{display:block;font-family:Georgia,serif;font-size:1.6rem;letter-spacing:.8em;background:linear-gradient(135deg,#c8a4f8,#9b6dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:up .7s cubic-bezier(.34,1.56,.64,1) .85s both}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.line{width:200px;height:1px;background:linear-gradient(90deg,transparent,#f5d020,transparent);margin-top:18px;animation:fi 1s ease 1.4s both;opacity:0}
.tag{font-family:Georgia,serif;font-size:.58rem;letter-spacing:.3em;color:rgba(245,208,32,.4);margin-top:10px;animation:fi 1s ease 1.6s both;opacity:0;text-transform:uppercase}
@keyframes fi{to{opacity:1}}
.dots{display:flex;gap:7px;margin-top:28px;animation:fi 1s ease 2s both;opacity:0}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(245,208,32,.5);animation:db 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes db{0%,80%,100%{transform:scale(.8);opacity:.4}40%{transform:scale(1.3);opacity:1}}
#stat{font-size:11px;color:rgba(165,180,252,.55);margin-top:10px;letter-spacing:.5px;animation:fi 1s ease 2.2s both;opacity:0;text-align:center;padding:0 24px}
#game-frame{position:fixed;inset:0;width:100%;height:100%;border:none;display:none;background:#000}
#maint{position:fixed;inset:0;z-index:1000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:32px;background:radial-gradient(ellipse at center,#0a0820 0%,#020008 70%)}
.m-img{width:80px;height:80px;border-radius:12px;object-fit:cover;margin-bottom:16px;opacity:.7}
.m-title{font-size:22px;font-weight:800;color:#fbbf24;margin-bottom:8px;text-align:center}
.m-sub{font-size:13px;color:rgba(165,180,252,.7);text-align:center;line-height:1.8;max-width:300px}
.m-btn{margin-top:24px;padding:13px 32px;background:linear-gradient(135deg,#f5d020,#f5a623);color:#000;font-size:14px;font-weight:800;border-radius:14px;border:none;cursor:pointer}
.m-timer{margin-top:10px;font-size:11px;color:rgba(165,180,252,.4)}
</style>
</head>
<body>
<div id="splash">
  <div class="logo-wrap">
    <div class="logo-glow"></div>
    <img class="logo-img" src="logo.jpg" onerror="this.style.display='none'">
  </div>
  <span class="eco">ECO</span>
  <span class="city">CITY</span>
  <div class="line"></div>
  <div class="tag">Ticaret İmparatorluğu</div>
  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div id="stat">Sunucu adresi alınıyor...</div>
</div>

<!-- Oyun iframe - tarayici ACILMAZ, app icinde kalir -->
<iframe id="game-frame"
  scrolling="yes"
  allowfullscreen="true"
  sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals allow-top-navigation-by-user-activation">
</iframe>

<div id="maint">
  <img class="m-img" src="logo.jpg" onerror="this.style.display='none'">
  <div class="m-title">⛓️ Sunucu Bakımda</div>
  <div class="m-sub">Ticaret İmparatorluğu sunucusu şu an bakım modunda.<br>Lütfen bekleyin.</div>
  <button class="m-btn" onclick="retryNow()">Tekrar Dene</button>
  <div class="m-timer" id="m-timer"></div>
</div>

<script>
var GIST_ID = '74851d6382d7d7c2b79d6d4b373684af';
var GIST_FILE = 'link.txt';
var curUrl = '';
var retryTimer = null;

function st(m) { var e = document.getElementById('stat'); if(e) e.textContent = m; }
function showMaint() { document.getElementById('maint').style.display = 'flex'; startRetry(30); }
function hideMaint() { document.getElementById('maint').style.display = 'none'; }

function startRetry(s) {
  var n = s;
  clearInterval(retryTimer);
  tick();
  retryTimer = setInterval(function() {
    n--;
    tick();
    if (n <= 0) { clearInterval(retryTimer); load(); }
  }, 1000);
  function tick() {
    var e = document.getElementById('m-timer');
    if(e) e.textContent = n > 0 ? n + ' saniye sonra tekrar...' : 'Deneniyor...';
  }
}

function retryNow() { clearInterval(retryTimer); hideMaint(); load(); }

function showGame(url) {
  var frame = document.getElementById('game-frame');
  var splash = document.getElementById('splash');
  curUrl = url;
  frame.src = url;
  frame.style.display = 'block';
  if (splash) {
    splash.classList.add('gone');
    setTimeout(function() { splash.style.display = 'none'; }, 900);
  }
}

async function load() {
  st('Sunucu adresi alınıyor...');
  try {
    var r = await fetch('https://api.github.com/gists/' + GIST_ID, {
      headers: { 'Accept': 'application/vnd.github.v3+json' },
      signal: AbortSignal.timeout(12000)
    });
    if (!r.ok) throw new Error('GitHub ' + r.status);
    var d = await r.json();
    var files = d.files || {};
    var f = files[GIST_FILE] || files[Object.keys(files)[0]];
    if (!f) throw new Error('Dosya yok');
    var url = (f.content || '').trim();
    if (!url.startsWith('http')) throw new Error('Sunucu URL yok');
    st('Bağlanılıyor...');
    showGame(url);
  } catch(e) {
    st(e.message);
    showMaint();
  }
}

// Auto-refresh URL her 60 saniyede (zrok URL degisince otomatik gunceller)
setInterval(async function() {
  if (document.getElementById('maint').style.display === 'flex') return;
  try {
    var r = await fetch('https://api.github.com/gists/' + GIST_ID, {
      headers: { 'Accept': 'application/vnd.github.v3+json' },
      signal: AbortSignal.timeout(8000)
    });
    var d = await r.json();
    var files = d.files || {};
    var f = files[GIST_FILE] || files[Object.keys(files)[0]];
    if (!f) return;
    var url = (f.content || '').trim();
    if (url && url !== curUrl && url.startsWith('http')) {
      curUrl = url;
      document.getElementById('game-frame').src = url;
    }
  } catch(e) {}
}, 60000);

setTimeout(load, 2600);
</script>
</body>
</html>
