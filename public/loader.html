<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#090c18;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:sans-serif;color:#fff}
.logo-img{width:130px;height:130px;border-radius:22px;object-fit:cover;margin-bottom:14px;box-shadow:0 0 40px rgba(200,150,10,0.6)}
h1{font-size:21px;font-weight:900;color:#f59e0b;margin-bottom:4px;text-align:center}
.sub{font-size:12px;color:#6b7280;margin-bottom:30px}
.spinner{width:36px;height:36px;border:3px solid rgba(245,158,11,.2);border-top:3px solid #f59e0b;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:14px}

#status{font-size:13px;color:#9ca3af;margin-bottom:20px;text-align:center;padding:0 24px;line-height:1.6;min-height:44px}
.mf{display:none;flex-direction:column;gap:10px;width:88%;max-width:320px;margin-top:4px}
.mf input{padding:12px 16px;border-radius:12px;border:1px solid #374151;background:#1f2937;color:#fff;font-size:14px;width:100%}
.mf button{padding:12px;border-radius:12px;border:none;background:#f59e0b;color:#000;font-size:14px;font-weight:700;cursor:pointer}
.rb{display:none;padding:10px 22px;border-radius:10px;border:1px solid #374151;background:#1f2937;color:#9ca3af;font-size:13px;cursor:pointer;margin-top:8px}
iframe{display:none;position:fixed;top:0;left:0;width:100%;height:100%;border:none;z-index:99}
</style>

<script>
var GID='74851d6382d7d7c2b79d6d4b373684af';
var GF='ticaret-server-url.txt';
var CK='ticaret_url';
var TTL=4*60*1000;
function st(m){document.getElementById('status').innerHTML=m;}
function sp(v){document.getElementById('sp').style.display=v?'block':'none';}
function showM(){sp(false);document.getElementById('mf').style.display='flex';document.getElementById('rb').style.display='inline-block';}
function gc(){try{var r=localStorage.getItem(CK);if(!r)return null;var o=JSON.parse(r);return Date.now()-o.ts>TTL?null:o.url;}catch(e){return null;}}
function sc(u){try{localStorage.setItem(CK,JSON.stringify({url:u,ts:Date.now()}));}catch(e){}}
async function gu(){
  var r=await fetch('https://api.github.com/gists/'+GID,{headers:{'Accept':'application/vnd.github.v3+json'},signal:AbortSignal.timeout(12000)});
  if(!r.ok)throw new Error('GitHub '+r.status);
  var d=await r.json(),f=d.files[GF];
  if(!f||!f.content||f.content.trim()==='henuz_baslatilmadi')throw new Error('Sunucu henuz baslatilmadi!
Termux'ta: bash ~/ticaret_game/baslat_ve_yayinla.sh');
  var u=f.content.trim();
  if(!u.startsWith('http'))throw new Error('Gecersiz URL');
  return u;
}
async function ping(u){try{var r=await fetch(u,{signal:AbortSignal.timeout(8000)});return r.status<500;}catch(e){return false;}}
function og(u){sc(u);sp(false);st('Baglandi! Yukleniyor...');setTimeout(function(){document.getElementById('gf').style.display='block';document.getElementById('gf').src=u;},400);}
async function start(){
  sp(true);document.getElementById('mf').style.display='none';document.getElementById('rb').style.display='none';
  var c=gc();
  if(c){st('Kayitli adrese baglaniliyor...');if(await ping(c)){og(c);return;}st('Kayitli adres yanit vermiyor...');}
  st('Sunucu adresi aliniyor...');
  var u;
  try{u=await gu();}
  catch(e){st('&#9888; '+e.message);setTimeout(showM,1500);return;}
  st('Baglaniliyor: '+u);
  if(await ping(u)){og(u);}else{st('&#9888; Sunucu yanit vermiyor!<br><small>Termux'ta sunucuyu baslat</small>');setTimeout(showM,1500);}
}
function mc(){var u=document.getElementById('mi').value.trim();if(!u)return;if(!u.startsWith('http'))u='https://'+u;og(u);}
start();
</script>
